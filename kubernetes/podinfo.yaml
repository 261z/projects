---
apiVersion: v1
kind: ConfigMap
metadata:
  name: podinfo
  namespace: geekshacking
data:
  PODINFO_UI_MESSAGE: "Hello from Geekshacking!"
  PODINFO_UI_COLOR: "green"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: geekshacking
  labels:
    app: podinfo

spec:
  replicas: 2

  selector:
    matchLabels:
      env: workshop
      dept: devops

  template:
    metadata:
      labels:
        env: workshop
        dept: devops

    spec:
      containers:
        - name: podinfo-container
          image: stefanprodan/podinfo:6.14.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9898
          env:
            - name: PODINFO_UI_MESSAGE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['dept']

---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: geekshacking
spec:
  type: LoadBalancer
  selector:
    env: workshop
    dept: devops
  ports:
    - port: 80
      targetPort: 9898